name: Release

# Runs when a GitHub Release is published, or manually via workflow_dispatch
# for a dry run (the publish job is skipped for manual runs unless the
# workflow is actually triggered by a release, see the `if:` guard below).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build and validate distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package and dev/build tooling
        run: python -m pip install -e ".[dev]" build twine

      - name: Run the test suite
        run: pytest -q

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distributions with twine
        run: python -m twine check dist/*

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    # Only publish on an actual GitHub Release event, never on a manual
    # workflow_dispatch run -- dispatch exists so the build/validate job above
    # can be exercised without publishing anything.
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agentlens-evaluator/
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) -- no API token is used
      # or stored anywhere in this repository.
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

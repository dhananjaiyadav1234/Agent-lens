[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentlens"
version = "0.1.0"
description = "Framework-agnostic observability, debugging, and deterministic issue detection for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentLens contributors" }]
keywords = [
    "ai-agents",
    "observability",
    "debugging",
    "tracing",
    "llm",
    "failure-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pydantic>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
langchain = [
    "langchain-core>=0.3",
]
openai-agents = [
    "openai-agents>=0.2",
]
crewai = [
    "crewai>=1.15,<2.0",
]

[project.scripts]
agentlens = "agentlens.cli.main:main"

[project.urls]
Homepage = "https://github.com/dhananjaiyadav1234/Agent-lens"
Repository = "https://github.com/dhananjaiyadav1234/Agent-lens"

[tool.hatch.build.targets.wheel]
packages = ["agentlens"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
# The `examples` package is developer-facing (not shipped in the wheel); put the
# repo root on sys.path so tests can import the demo scenarios.
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["agentlens", "examples", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# Tests favour explicit, nested `with` blocks (e.g. an open trace wrapping a
# `pytest.raises`) for readability over SIM117's single-statement form.
"tests/**" = ["B011", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["agentlens", "examples"]
